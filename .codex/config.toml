# This machine's project-only MCP. Re-run setup and adjust paths after relocating.
[mcp_servers.hgis_graft]
command = 'C:\Program Files\nodejs\node.exe'
args = ['A:\qgis\scripts\graft-mcp.mjs']
cwd = 'A:\qgis'
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled_tools = ['graft_find_code', 'graft_file_api', 'graft_find_all', 'graft_check_freshness']

[mcp_servers.hgis_graft.env]
DO_NOT_TRACK = '1'
CI = '1'
