<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ka-hgis">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F3D4C"/>
      <stop offset="55%" stop-color="#1F6F78"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <linearGradient id="soil" x1="120" y1="300" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C48A4A"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <linearGradient id="map" x1="140" y1="120" x2="370" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F1E8"/>
      <stop offset="100%" stop-color="#D9D2C0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" filter="url(#soft)"/>

  <!-- Subtle grid -->
  <g stroke="#E8F4F2" stroke-opacity="0.14" stroke-width="3">
    <path d="M110 160 H402"/>
    <path d="M110 220 H402"/>
    <path d="M110 280 H402"/>
    <path d="M110 340 H402"/>
    <path d="M170 120 V380"/>
    <path d="M250 120 V380"/>
    <path d="M330 120 V380"/>
  </g>

  <!-- Map sheet -->
  <path d="M128 118 H360 L392 150 V360 Q392 384 368 384 H128 Q104 384 104 360 V142 Q104 118 128 118 Z"
        fill="url(#map)" stroke="#2C2418" stroke-opacity="0.18" stroke-width="6"/>
  <!-- Folded corner -->
  <path d="M360 118 L392 150 H372 Q360 150 360 138 Z" fill="#B9A88A"/>

  <!-- Survey trench / excavation polygon -->
  <path d="M168 250 L248 210 L318 236 L300 312 L210 330 Z"
        fill="url(#soil)" stroke="#5C3A1E" stroke-width="8" stroke-linejoin="round"/>
  <!-- Inner feature polygon -->
  <path d="M210 256 L262 238 L286 268 L248 296 Z"
        fill="#E7C27A" stroke="#6B4A1F" stroke-width="5" stroke-linejoin="round"/>

  <!-- Control point / GPS crosshair -->
  <g transform="translate(318 198)">
    <circle r="28" fill="#0B3A44" fill-opacity="0.9"/>
    <circle r="12" fill="#F2C14E"/>
    <path d="M0 -40 V-20 M0 20 V40 M-40 0 H-20 M20 0 H40"
          stroke="#F2C14E" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- North tick -->
  <path d="M150 156 L162 188 L150 178 L138 188 Z" fill="#1F6F78"/>

  <!-- Soft highlight -->
  <path d="M80 78 Q256 40 430 100" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round"/>
</svg>
